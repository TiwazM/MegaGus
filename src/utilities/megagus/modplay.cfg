# ld65's plan of memory for modplay on the MEGA65 (a C64-mode program, as cc65's c64.cfg has
# it, with overlays):
#
#   $0801   the program, its variables, the C stack
#   OVLB    the file list (modplay.prg.1) or the playing screens (.2)
#   OVLA    the player of the module's kind: MOD and S3M (.3) or XM (.4)
#   $D000
#
# The overlays are not loaded with the program: it reads them from the SD card itself
# (MODPLAY.OV1 to MODPLAY.OV4) and copies in the ones it needs.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak,   value = $0300;
    __OVLB__:      type = export, value = $8600;
    __OVLA__:      type = export, value = $9A00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    # the C stack begins at MAIN's end and grows down towards the variables
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __OVLB__ - __HEADER_LAST__;
    # c64.cfg puts the variables over the start-up code (ONCE), which is then gone: such a
    # program crashes when it is RUN a second time. Here they come after it.
    BSS:      file = "",               start = __ONCE_RUN__ + __ONCE_SIZE__, size = __OVLB__ - __STACKSIZE__ - __ONCE_RUN__ - __ONCE_SIZE__;
    OVL1:     file = "%O.1", define = yes, start = __OVLB__,        size = __OVLA__ - __OVLB__;
    OVL2:     file = "%O.2", define = yes, start = __OVLB__,        size = __OVLA__ - __OVLB__;
    OVL3:     file = "%O.3", define = yes, start = __OVLA__,        size = $D000 - __OVLA__;
    OVL4:     file = "%O.4", define = yes, start = __OVLA__,        size = $D000 - __OVLA__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define = yes;
    BSS:      load = BSS,      type = bss, define = yes;
    OVL1HEAD: load = OVL1,     type = ro;
    OVERLAY1: load = OVL1,     type = ro;
    OVL2HEAD: load = OVL2,     type = ro;
    OVERLAY2: load = OVL2,     type = ro;
    OVL3HEAD: load = OVL3,     type = ro;
    OVERLAY3: load = OVL3,     type = ro;
    OVL4HEAD: load = OVL4,     type = ro;
    OVERLAY4: load = OVL4,     type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
